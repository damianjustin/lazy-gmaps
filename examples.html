<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>lazy-gmaps.js examples</title>

    <!-- Configuration first, then lazy-gmaps.js with defer. -->
    <script>
        window.lazyGMapsConfig = {
            key: "YOUR_API_KEY",
            marker: "/img/marker@2x.png",     // your default marker (a 2× PNG)
            markerSize: "24x33",              // shown at this size
            styles: {
                "default":      [{ featureType: "poi", stylers: [{ visibility: "off" }] }],
                "default/dark": [{ featureType: "all", stylers: [{ invert_lightness: true }] }],  // when the browser is in dark mode
                "muted":        [{ featureType: "all", stylers: [{ saturation: -80 }] }],
                "muted/dark":   [{ featureType: "all", stylers: [{ saturation: -80 }, { lightness: -60 }] }]
            },
            mapOptions: { streetViewControl: false },
            loaderParams: { language: "en", region: "AU" }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lazy-gmaps@0.1.0/lazy-gmaps.js" defer></script>

    <style>
        body { font: 16px/1.5 system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
        .map { height: 360px; border-radius: 8px; background: #e8edf1; margin: 12px 0 40px; }
        dialog { width: min(800px, 90vw); }
    </style>
</head>
<body>

    <h2>Map</h2>
    <div class="map" data-gmap data-gmap-lat="-31.9523" data-gmap-lng="115.8613" data-gmap-zoom="15"></div>

    <h2>Marker and popup</h2>
    <div class="map" data-gmap
         data-gmap-lat="-31.9900" data-gmap-lng="115.7600" data-gmap-zoom="14"
         data-gmap-options='{"disableDefaultUI": true, "zoomControl": true}'
         data-gmap-title="Showroom" data-gmap-popup="Open Saturday and Sunday, 1–5pm" data-gmap-popup-open>
        <!-- Server-rendered fallback for visitors without JavaScript and for bots. -->
        <a href="https://www.google.com/maps/search/?api=1&amp;query=-31.99,115.76">Open in Google Maps</a>
    </div>

    <h2>Init function</h2>
    <div class="map" data-gmap
         data-gmap-lat="-31.97" data-gmap-lng="115.82" data-gmap-zoom="11"
         data-gmap-init="addLocations"></div>

    <h2>Style set with a dark pair</h2>
    <div class="map" data-gmap data-gmap-lat="-32.0569" data-gmap-lng="115.7439" data-gmap-zoom="14"
         data-gmap-style="muted" data-gmap-title="Fremantle"></div>

    <h2>In a modal</h2>
    <button type="button" onclick="openMap(-31.9523, 115.8613, 'Head office')">Head office</button>
    <button type="button" onclick="openMap(-33.3300, 115.6400, 'Bunbury')">Bunbury</button>
    <dialog id="map-dialog" onclose="closeMap()">
        <div id="dialog-map-host"></div>
        <form method="dialog"><button>Close</button></form>
    </dialog>

    <!-- Init functions are defined in the page (or a script loaded before lazy-gmaps.js starts). -->
    <script>
        // Init function: receives the map lazy-gmaps.js built, and ctx with the container, options and google.
        function addLocations(map, ctx) {
            const { maps } = ctx.google;
            const locations = [
                { name: "Coast office", lat: -31.990, lng: 115.760 },
                { name: "Hills office", lat: -31.930, lng: 116.010 },
                { name: "City office",  lat: -31.950, lng: 115.870 }
            ];
            const info = new maps.InfoWindow();
            const bounds = new maps.LatLngBounds();
            locations.forEach((l) => {
                const marker = new maps.Marker({ map, position: l, title: l.name });
                marker.addListener("click", () => { info.setContent(l.name); info.open({ map, anchor: marker }); });
                bounds.extend(l);
            });
            map.fitBounds(bounds);
        }

        // Modal: create a map on open, destroy it on close.
        function openMap(lat, lng, title) {
            const host = document.getElementById("dialog-map-host");
            host.innerHTML = "";
            const el = document.createElement("div");
            el.className = "map";
            el.setAttribute("data-gmap", "");
            el.setAttribute("data-gmap-lat", lat);
            el.setAttribute("data-gmap-lng", lng);
            el.setAttribute("data-gmap-title", title);
            el.setAttribute("data-gmap-popup", title);
            host.appendChild(el);
            document.getElementById("map-dialog").showModal();
            LazyGMaps.load(el);   // now, without waiting for the viewport

            // { map, marker, infoWindow } once shown; null for bots and errors.
            LazyGMaps.ready(el).then((shown) => {
                if (shown) shown.infoWindow.open({ map: shown.map, anchor: shown.marker });
            });
        }
        function closeMap() {
            const el = document.querySelector("#dialog-map-host [data-gmap]");
            if (el) LazyGMaps.destroy(el);
        }

        // Events bubble, so one listener covers every map on the page.
        document.addEventListener("gmap:ready", (e) => console.log("map ready", e.target));
        document.addEventListener("gmap:error", (e) => console.warn("map failed", e.target, e.detail));
    </script>
</body>
</html>
